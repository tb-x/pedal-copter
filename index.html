<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  window.__errors = [];
  addEventListener('error', (e) => { __errors.push(String(e.message)); document.documentElement.dataset.err = __errors.join(' | '); });

<style>
  /* Layout: full-screen 3D valley diorama; HUD is a 56px top bar (progress, give-ups) between home (top-left) and map/mute (top-right); steering pads in the bottom corners (pads mode only); level map and win card are overlays */
  :root{
    --cream:#FFF6E5; --lip:#E3CFA8; --ink:#2B2B3A; --gold:#FFC93C; --gold-edge:#E59A00; --green:#35C24A; --sky:#8FD0F5;
    --stone:#B9AF9F; --stone-edge:#8E8576;
    --title:'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif; --digits:Verdana,Tahoma,sans-serif;
    --st:env(safe-area-inset-top,0px); --sr:env(safe-area-inset-right,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);font-family:var(--title);color:var(--ink);
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .btn{background:var(--cream);box-shadow:0 4px 0 var(--lip),0 6px 10px rgba(0,0,0,.15);border-radius:50%;display:grid;place-items:center}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}

  /* ---------- home + HUD ---------- */
  #home{position:fixed;top:calc(6px + var(--st));left:calc(10px + var(--sl));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.85);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home svg{width:24px;height:24px}
  #home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #hud{position:fixed;z-index:20;display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:none;
    top:calc(6px + var(--st));left:calc(64px + var(--sl));right:calc(114px + var(--sr));height:44px}
  #progIcons{display:flex;gap:2px;padding:4px 8px;border-radius:14px;background:rgba(255,255,255,.7)}
  .pi{width:14px;height:19px;color:rgba(43,43,58,.25);transition:color .2s}
  .pi svg{width:100%;height:100%;fill:currentColor;display:block}
  .pi.on{color:var(--green);animation:pop .35s ease-out}
  #progBar{position:relative;width:min(100%,180px);min-width:80px;height:28px;border-radius:14px;background:rgba(255,255,255,.75);
    box-shadow:inset 0 0 0 3px #fff;overflow:hidden;flex:0 1 auto}
  #progFill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0) * 100%);background:var(--green);transition:width .3s}
  #progText{position:relative;display:block;text-align:center;font:bold 15px/28px var(--digits);color:var(--ink)}
  #food{display:flex;align-items:center;gap:3px;padding:2px 8px;border-radius:14px;background:rgba(255,255,255,.75);font-size:18px;line-height:24px}
  #foodBar{width:58px;height:14px;border-radius:7px;background:#E8DCC6;overflow:hidden;box-shadow:inset 0 0 0 2px #fff}
  #foodFill{height:100%;width:calc(var(--f,1) * 100%);background:#E8873A;border-radius:7px}
  #food.low{animation:pulse .7s ease-in-out infinite}
  #food.low #foodFill{background:#FF5A4A}
  #boost{display:flex;align-items:center;gap:3px;padding:2px 8px;border-radius:14px;background:rgba(255,255,255,.75);font-size:18px;line-height:24px}
  #boostBar{width:44px;height:14px;border-radius:7px;background:#DCEAF2;overflow:hidden;box-shadow:inset 0 0 0 2px #fff}
  #boostFill{height:100%;width:calc(var(--f,1) * 100%);background:#4FB3E8;border-radius:7px}
  #gone{display:flex;align-items:center;gap:2px;padding:2px 8px;border-radius:14px;background:rgba(255,255,255,.75);
    font:bold 15px/24px var(--digits);white-space:nowrap}
  #gone.bump{animation:pop .4s ease-out}
  #hudR{position:fixed;z-index:46;top:calc(6px + var(--st));right:calc(10px + var(--sr));display:flex;gap:10px}
  #hudR .btn{width:44px;height:44px;font-size:22px}

  /* ---------- pads (pedal-and-steer controls) ---------- */
  #pads{position:fixed;inset:auto 0 0 0;z-index:22;pointer-events:none;height:0}
  .pad{position:fixed;bottom:calc(14px + var(--sb));width:84px;height:84px;font-size:36px;pointer-events:auto;
    background:rgba(255,246,229,.82);box-shadow:0 5px 0 var(--lip),0 6px 12px rgba(0,0,0,.18)}
  .pad.held{transform:translateY(4px);box-shadow:0 1px 0 var(--lip);background:#fff}
  #padL{left:calc(14px + var(--sl))}
  #padR{left:calc(110px + var(--sl))}
  #padUp{right:calc(14px + var(--sr));width:104px;height:104px;font-size:44px;background:rgba(255,214,120,.9);box-shadow:0 5px 0 var(--gold-edge),0 6px 12px rgba(0,0,0,.18)}
  #padUp.held{box-shadow:0 1px 0 var(--gold-edge)}

  /* ---------- feedback: ripple, hint hand ---------- */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
  .ripple{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border:4px solid #fff;border-radius:50%;
    animation:rip .5s ease-out forwards;box-shadow:0 0 6px rgba(0,0,0,.25)}
  @keyframes rip{to{transform:scale(4);opacity:0}}
  #hand{position:fixed;z-index:16;font-size:54px;line-height:1;pointer-events:none;margin:0 0 0 -18px;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));animation:hand 1s ease-in-out infinite}
  @keyframes hand{50%{transform:translateY(12px) scale(1.12)}}
  #hand.hold{animation:holdHand 1.6s ease-in-out infinite}
  #hand.hold::after{content:'';position:absolute;left:4px;top:-6px;width:28px;height:28px;border-radius:50%;border:4px solid #fff;
    box-shadow:0 0 6px rgba(0,0,0,.3);animation:holdRing 1.6s ease-out infinite}
  @keyframes holdHand{0%,100%{transform:translateY(0)}20%,80%{transform:translateY(10px) scale(.95)}}
  @keyframes holdRing{0%,20%{transform:scale(.4);opacity:0}30%{opacity:1}80%{transform:scale(1.6);opacity:0}100%{opacity:0}}
  .edge{position:fixed;z-index:18;height:52px;margin-top:-26px;padding:0 10px;border-radius:26px;display:flex;align-items:center;gap:4px;
    background:rgba(255,255,255,.88);box-shadow:0 4px 0 var(--lip);pointer-events:none;font:bold 20px/1 var(--digits)}
  .edge i{font-style:normal;color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
    text-shadow:0 0 3px #2B2B3A,0 0 2px #2B2B3A}
  #edgeL{left:calc(6px + var(--sl))}
  #edgeR{right:calc(6px + var(--sr))}
  .edge.vert{flex-direction:column;height:auto;padding:6px 8px;margin:0 0 0 -28px;gap:2px}
  #edgeU{top:calc(60px + var(--st))}
  .edge.angry{animation:pulse .6s ease-in-out infinite;background:#FFD2CC}
  @keyframes pulse{50%{transform:scale(1.15)}}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.45)}100%{transform:scale(1)}}

  /* ---------- level map ---------- */
  #map{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    padding:calc(60px + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl));
    background:linear-gradient(rgba(143,208,245,.55),rgba(233,214,180,.6))}
  #map h1{margin:0;font-family:var(--title);font-weight:700;font-size:clamp(40px,11vmin,72px);color:#fff;letter-spacing:1px;text-align:center;
    text-shadow:0 4px 0 #8A5A34,0 6px 14px rgba(0,0,0,.25);-webkit-text-stroke:2px #8A5A34}
  #play{width:clamp(96px,24vmin,130px);height:clamp(96px,24vmin,130px);background:var(--green);box-shadow:0 7px 0 #24852f,0 0 0 8px rgba(255,255,255,.6);
    animation:pulse 1.3s ease-in-out infinite}
  #play svg{width:46%;height:46%;margin-left:8%}
  #levels{display:grid;grid-template-columns:repeat(4,var(--lb));gap:10px;padding:12px;border-radius:18px;background:rgba(185,175,159,.9);box-shadow:0 0 0 5px #fff6e5;
    --lb:clamp(44px,min(64px,calc((100vh - 400px) / 3)),64px)}
  .lv{width:var(--lb);height:var(--lb);border-radius:14px;background:var(--cream);box-shadow:0 4px 0 var(--lip);display:flex;flex-direction:column;
    align-items:center;justify-content:center;font:bold calc(var(--lb) * .36)/1 var(--digits);color:var(--ink)}
  .lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lip)}
  .lv small{font-size:calc(var(--lb) * .2);letter-spacing:-1px;margin-top:3px;color:#c9b9a0}
  .lv small i{font-style:normal;color:var(--gold);text-shadow:0 1px 0 var(--gold-edge)}
  .lv{position:relative}
  .lv .tm{position:absolute;top:2px;right:3px;font-size:calc(var(--lb) * .22);line-height:1}
  .lv.locked{opacity:.55}
  #ctlRow{display:flex;gap:12px;padding:8px 12px;border-radius:30px;background:rgba(255,255,255,.55)}
  #ctlRow .btn{width:56px;height:56px;font-size:28px;opacity:.55}
  #ctlRow .btn.on{opacity:1;box-shadow:0 4px 0 var(--lip),0 0 0 4px var(--green)}
  #vibBtn{margin-left:10px}
  @media (min-aspect-ratio: 13/10) and (max-height: 520px){
    #map{flex-direction:row;flex-wrap:wrap;gap:20px;padding-top:calc(12px + var(--st))}
    #levels{--lb:clamp(40px,calc((100vh - 80px) / 3 - 10px),64px)}
  }

  /* ---------- win card ---------- */
  #win{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:rgba(43,43,58,.25)}
  #card{display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 26px;border-radius:28px;background:var(--cream);
    box-shadow:0 8px 0 var(--lip),0 14px 30px rgba(0,0,0,.25);animation:cardIn .4s ease-out}
  @keyframes cardIn{from{transform:scale(.6);opacity:0}}
  #starRow{display:flex;gap:8px}
  .star{font-size:clamp(52px,15vmin,84px);line-height:1;color:#ddd3c2;transform:scale(0)}
  .star.on{color:var(--gold);text-shadow:0 4px 0 var(--gold-edge)}
  .star.show{animation:starIn .45s cubic-bezier(.3,1.6,.5,1) forwards}
  @keyframes starIn{to{transform:scale(1)}}
  #cardBtns{display:flex;gap:14px}
  #cardBtns .btn{width:64px;height:64px;font-size:30px}
  #bNext{background:var(--green)!important;box-shadow:0 4px 0 #24852f!important}
  .conf{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }

<body>
<canvas id="c"></canvas>
<a id="home" href="../index.html" aria-label="All games" title="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>
<div id="hud" hidden>
  <div id="progIcons"></div>
  <div id="progBar" hidden><div id="progFill"></div><span id="progText">0/5</span></div>
  <div id="food" hidden><span>🍗</span><div id="foodBar"><div id="foodFill"></div></div></div>
  <div id="boost" hidden><span>🪶</span><div id="boostBar"><div id="boostFill"></div></div></div>
  <div id="gone" hidden><span>🚶</span><span id="goneN">0</span></div>
</div>
<div id="hudR">
  <button id="mapBtn" class="btn" aria-label="Levels">🗺️</button>
  <button id="muteBtn" class="btn" aria-label="Sound on or off">🔊</button>
</div>
<div id="pads" hidden>
  <button id="padL" class="btn pad" data-pad="left" aria-label="Left">◀</button>
  <button id="padR" class="btn pad" data-pad="right" aria-label="Right">▶</button>
  <button id="padUp" class="btn pad" data-pad="pedal" aria-label="Pedal">🦶</button>
</div>
<div id="fx"></div>
<div id="hand" hidden>👆</div>
<div id="edgeL" class="edge" hidden><b>◀</b><i></i></div>
<div id="edgeR" class="edge" hidden><i></i><b>▶</b></div>
<div id="edgeU" class="edge vert" hidden><b>▲</b><i></i></div>
<div id="edgeD" class="edge vert" hidden><i></i><b>▼</b></div>
<div id="map" hidden>
  <h1>Pedal-Copter</h1>
  <button id="play" class="btn" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z" fill="#fff"/></svg></button>
  <div id="levels"></div>
  <div id="ctlRow">
    <button id="ctlFollow" class="btn" aria-label="Fly to my finger">👆</button>
    <button id="ctlPads" class="btn" aria-label="Pedal and steer buttons">🕹️</button>
    <button id="vibBtn" class="btn" aria-label="Vibration on or off" hidden>📳</button>
  </div>
</div>
<div id="win" hidden>
  <div id="card">
    <div id="starRow"><span class="star">★</span><span class="star">★</span><span class="star">★</span></div>
    <div id="cardBtns">
      <button id="bReplay" class="btn" aria-label="Play again">↻</button>
      <button id="bNext" class="btn" aria-label="Next level">▶</button>
      <button id="bMap" class="btn" aria-label="Levels">🗺️</button>
    </div>
  </div>
</div>

<script type="module">
/* ======== imports ======== */
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ======== tuning ======== */
const FIXED_DT = 1 / 60;          // simulation step (s)
const FLY_SPEED = 6;              // copter top speed (units/s); a ledge step is ~3 units, a person ~1.4
const FLY_ACCEL = 9;              // speeding up and braking towards where it's steered (units/s²)
const FOLLOW_GAIN = 2.2;          // follow-the-finger: speed per unit of distance to the finger (eases in near it)
const FOLLOW_DEADZONE = 0.35;     // closer than this to the finger and the copter just hovers
const SINK_SPEED = 1.3;           // let go: the copter comes down this fast (units/s)
const SINK_ACCEL = 2.5;           // ... reaching that speed this quickly (units/s²)
const SIDE_DRAG = 3.5;            // let go: sideways speed fades this fast (units/s²)
const PAD_LIFT = 10;              // pedal pads: climb acceleration while pedalling (units/s²)
const PAD_GRAVITY = 4;            // pedal pads: pull down when not pedalling (units/s²)
const PAD_FALL_MAX = 2.6;         // pedal pads: never falls faster than this (units/s)
const CLIMB_HELP_BELOW = 0.6;     // follow-the-finger: a finger this far below a rock step's top (or higher) climbs over it
const TAKEOFF_HOP = 1.6;          // upward speed when lifting off (units/s)
const BUMP_BOUNCE = 0.45;         // share of speed kept when boinging off rock
const BUMP_MIN = 0.8;             // slower than this into rock and it just stops, no boing
const SPLASH_UP = 4.5;            // dipping into the lake bounces the copter up this fast
const DIZZY_TIME = 1.2;           // s the pilot's eyes spin after a bump
const COPTER_HX = 1.35, COPTER_H = 2.1;   // copter collision box: half width, height above the skids (rotor included)
const POWERUP_FROM = 2;           // power-ups float up from this level on
const POWERUP_EVERY = [16, 26];   // s between two power-ups appearing (one at a time)
const POWERUP_LIFE = 14;          // s a power-up floats before it pops by itself (it blinks for its last 3 s)
const POWERUP_R = 0.9;            // how close the copter has to fly to catch one
const BOOST_TIME = 15, BOOST = 1.5;   // feather: this many seconds this much faster
const SEATS_MAX = 4;              // log: an extra seat for the rest of the level, up to this many seats
const CALM_SHARE = 0.5;           // flower: everyone waiting gets this share of their waiting forgiven
const SKY_EXTRA = 9;               // the copter can climb this far above the top of the level's view; the camera follows it up
const TURN_SPEED = 0.8;           // the copter turns round once it flies this fast the other way (units/s)
const TURN_SPRING = 34, TURN_DAMP = 11;   // how quickly it swings round, and how softly it settles
const TILT_PER_SPEED = 0.05, TILT_MAX = 0.3;   // nose down per unit of forward speed, and at most (radians)
const BANK_PER_TURN = 0.045, BANK_MAX = 0.28;  // lean into a turn per rad/s of turning, and at most
const COPTER_HX_BIG = 1.65;       // ... half width of the longer 3- and 4-seat copters
const WIND_GUST = 0.75;           // windy levels: this share of the wind comes and goes in gusts (the rest blows steadily)
const HUNGER_TIME = 30;           // s of hard pedalling on a full tummy (gliding down uses a quarter as much)
const HUNGRY_CLIMB = 0.9;         // an empty tummy: the copter still climbs, but only this slowly (units/s)...
const HUNGRY_SPEED = 0.6;         // ... and flies this much slower, until the pilot eats
const EAT_TIME = 1.6;             // s to eat from empty to full, landed at a fruit or campfire stop
const FOOD_LOW = 0.3;             // below this the food meter pulses and the hint hand points at food
const FOOD_KINDS = ['fruit', 'fire'];
const SPECIAL_CHANCE = 0.12;      // chance per arrival of each special passenger the level has
const GRANNY_SLOW = 0.5, GRANNY_PATIENCE = 1.5;   // grandma walks this much slower and waits this much longer
const PTERO_SPEED = 2.2, PTERO_EVERY = [12, 20], PTERO_R = 0.75;  // pterodactyls in the way: speed, gap between them (s), size
const RING_SPEED = 1.1, RING_EVERY = [7, 11], RING_R = 1.05;     // volcano smoke rings: speed, gap (s), how close counts as through
const MAX_VIEW_W = 32;            // the camera shows at most this much of a wide valley; the rest scrolls with the copter

const MOOD_T = [0.35, 0.6, 0.8, 1.0];  // wait/patience thresholds: happy, ok, grumpy, angry, then they walk home
const RIDE_PATIENCE_RATE = 0.3;   // patience runs out this much slower in the copter (and nobody leaves from it)
const QUEUE_MAX = 3;              // people waiting at one stop at most
const QUEUE_START = 1.9, QUEUE_GAP = 0.6;  // first waiting place this far from the stop's sign, then this far apart
const CAVE_DX = 3.3;              // cave room's centre this far from the stop's sign (on the queue side)
const HOP_GAP = 0.25;             // people hop in and out this far beside the copter's side
const WALK_SPEED = 1.5;           // people walking (units/s)
const BOARD_GAP = 0.35;           // gap between two people hopping in or out (s)
const MAX_PEOPLE = 8;             // people in the valley at most
const KID_SHARE = 0.22;           // share of passengers who are kids (smaller, same rules)
const ARRIVE_JITTER = 0.3;        // ±30% on the arrival interval
const FIRST_ARRIVAL = 1.0;        // first person comes out after this (s)
const CELEBRATE_TIME = 1.1;       // delivered people cheer this long (s)
const HINT_DELAY = [2, 8];        // idle seconds before the hint hand shows: level 1 / later levels
const AUTOPILOT_LEVELS = [1, 2];  // levels where tapping a stop flies the copter there by itself
const TAP_MS = 300, TAP_PX = 14;  // a touch shorter and smaller than this counts as a tap
const CRUISE_CLEAR = 0.8;         // autopilot flies this high above the tallest rock on its way
const WIN_DELAY = 0.9;            // pause before the win card (s)
const FAST_MULT = 4;              // ?fast speed-up
const BOT_THINK = 0.5;            // ?demo bot decides this often (s)
const CAM_FOV = 30, CAM_YAW = 6, CAM_PITCH = 4;   // degrees, as Going Up!
const TOP_BAR = 56, PAD_BAR = 64;    // px kept clear of the valley: HUD on top, pads at the bottom (pads mode)
const MIN_UNIT_PX = 26;           // the camera never zooms out further than this many px per unit (a person is ~1.4 units);
                                  // a valley that doesn't fit then scrolls, following the copter
const CAM_FOLLOW = 3;             // how quickly a scrolling camera catches up with the copter (1/s)
const MAX_DPR_PHONE = 1.5, MAX_DPR = 2;   // pixel density caps: phones / everything else
const DPR_MIN = 1, DPR_STEP = 0.25, SLOW_FRAME_MS = 24, FAST_FRAME_MS = 15;   // adaptive sharpness: steps down when the median frame is slower
const SHADOW_EVERY = 2;           // frames between sun shadow redraws (the copter and people move; 30 times a second is plenty)
const BUBBLE_PX = 66;             // target on-screen size of a bubble (px)

/* ======== levels ======== */

function groundSpan(L) {   // the widest stretch of open ground between rock steps
  const edges = [0, ...L.blocks.flatMap(([a, b]) => [a, b]), L.w].sort((a, b) => a - b);
  let best = null;

    const a = edges[k], b = edges[k + 1], m = (a + b) / 2;
    if (surfaceAt(L, m) > 0 || (L.lake && m > L.lake[0] && m < L.lake[1])) continue;
    if (!best || b - a > best[1] - best[0]) best = [a, b];
  }
  return best && best[1] - best[0] > 3 ? best : null;
}
function flyers(grp, L, anims, wallTop, n, size, color, z, speed, flock) {

  const x0 = -16, x1 = L.w + 16;
  anims.push((t) => {
    list.forEach((f, k) => {
      const lap = (x1 - x0) / speed + (flock ? 10 : 7), tt = (t + (flock ? 0 : k * lap / n)) % lap, dir = Math.floor((t + k * 3) / lap) % 2 ? -1 : 1;

      f.g.rotation.set(f.flap ? (dir > 0 ? 0.4 : -0.4) : 0, dir > 0 ? -0.55 : Math.PI + 0.55, 0);

/* ======== level setup ======== */
function startLevel(n) {
  n = clamp(n | 0, 0, LEVELS.length - 1);
  rng = mulberry32(SEED + n * 101);
  const L = LEVELS[n];
  if (world) { scene.remove(world); }
  for (const p of G.people) p.fig.group.removeFromParent();
  Object.assign(G, { lv: n, L, t: 0, people: [], delivered: 0, gaveUp: 0, bumps: 0, autopilot: null, lastInput: 0, winT: -1,
    boardT: 0, fullT: 0, botT: 0, nextArrival: FIRST_ARRIVAL, firstDone: false, food: 1, chompT: 0, pteros: [], rings: [],
    pteroT: 5, ringT: 2, rushT: L.rush ? L.rush.every * 0.6 : 0, ringsPopped: 0, trexRoar: null,
    powerups: [], pops: [], powerT: POWERUP_EVERY[0] * 0.6, boostT: 0 });
  G.seats = L.seats; copterHX = G.seats > 2 ? COPTER_HX_BIG : COPTER_HX;
  applyTime(Q.get('time') || L.time);
  const stops = L.stops.map((s, i) => {
    const y = s.on >= 0 ? L.blocks[s.on][2] : 0;
    return { i, num: i + 1, kind: s.kind, icon: STOP_ICONS[s.kind], color: STOP_COLORS[i % STOP_COLORS.length], x: s.x, y, dir: s.dir, caveX: s.x + s.dir * CAVE_DX };
  });
  world = buildWorld(L, stops); scene.add(world);
  G.stops = stops;
  G.rects = [];
  const gx0 = -14, gx1 = L.w + 14;
  const segs = L.lake ? [[gx0, L.lake[0]], [L.lake[1], gx1]] : [[gx0, gx1]];
  for (const [a, b] of segs) G.rects.push({ x0: a, x1: b, y0: -6, y1: 0 });
  if (L.lake) G.rects.push({ x0: L.lake[0], x1: L.lake[1], y0: -6, y1: -1.0 });
  for (const [a, b, top] of L.blocks) G.rects.push({ x0: a, x1: b, y0: -1, y1: top });
  if (L.sleeper) G.rects.push({ x0: L.sleeper[0] + 0.3, x1: L.sleeper[1] - 0.3, y0: -1, y1: SLEEPER_TOP });
  const cv = buildCopter(G.seats);
  world.add(cv.group);
  for (const st of stops) {
    const same = (x) => Math.abs(topAt(x) - st.y) < 0.01;
    let a = st.x, b = st.x;
    while (a > 0 && same(a - 0.1)) a -= 0.1;
    while (b < L.w && same(b + 0.1)) b += 0.1;
    st.zone = [a, b];
  }
  for (const s1 of stops) for (const s2 of stops) {
    if (s1 === s2 || Math.abs(s1.y - s2.y) > 0.01 || s1.x >= s2.x || s1.zone[1] < s2.x) continue;   // s1 left of s2 on one ledge
    const mid = (s1.x + s2.x) / 2; s1.zone[1] = Math.min(s1.zone[1], mid); s2.zone[0] = Math.max(s2.zone[0], mid);
  }
  const startStop = stopAt(L.start, topAt(L.start));
  G.copter = { x: L.start, y: topAt(L.start), vx: 0, vy: 0, landed: { stop: startStop ? startStop.i : -1 }, face: 1, pedal: 0, rotorRate: 0,
    rotor: 0, crank: 0, dizzy: 0, eating: 0, yaw: 0, yawV: 0, pitch: 0, riders: [], vis: cv, intent: { kind: 'none' } };
  G.maxTop = Math.max(...G.rects.map((r) => r.y1));
  renderProgress();
  cam.ready = false;
  layout();
  tbx('level-start', { level: n + 1 });
}

/* ======== physics ======== */
const speedBoost = () => (G.boostT > 0 ? BOOST : 1);
function topAt(x) { let y = -1; for (const r of G.rects) if (x >= r.x0 && x <= r.x1) y = Math.max(y, r.y1); return y; }
function stopAt(x, y) { return G.stops.find((s) => Math.abs(s.y - y) < 0.01 && x >= s.zone[0] && x <= s.zone[1]); }   // whose ledge is this?
function windNow() {      // blows to the right: a steady part plus slow gusts
  const W = G.L.wind || 0;
  if (!W) return 0;
  const g = Math.pow(Math.max(0, Math.sin(G.t * 0.33)), 2) * (0.7 + 0.3 * Math.sin(G.t * 1.9));
  return W * ((1 - WIND_GUST) + WIND_GUST * g);
}
const isFood = (i) => i >= 0 && FOOD_KINDS.includes(G.stops[i].kind);
function overlaps(r, x, y) { return x + copterHX > r.x0 && x - copterHX < r.x1 && y + COPTER_H > r.y0 + 1e-4 && y < r.y1 - 1e-4; }
function controlIntent() {
  const k = (...c) => c.some((x) => keys.has(x));
  const left = pads.left || k('ArrowLeft', 'KeyA'), right = pads.right || k('ArrowRight', 'KeyD'), pedal = pads.pedal || k('ArrowUp', 'KeyW', 'Space');
  if (left || right || pedal) { G.autopilot = null; G.lastInput = G.t; return { kind: 'pads', left, right, pedal }; }
  if (G.autopilot) { const v = autopilotVel(); if (v) return { kind: 'steer', dvx: v.x, dvy: v.y, auto: true }; }
  if (ptr.active && ctlMode === 'follow') {
    G.lastInput = G.t;
    const c = G.copter, w = screenToWorld(ptr.sx, ptr.sy);
    if (!w) return { kind: 'none' };
    const dx = w.x - c.x, dy = w.y - (c.y + 0.9), d = Math.hypot(dx, dy);
    if (d < FOLLOW_DEADZONE) return { kind: 'steer', dvx: 0, dvy: 0 };
    const sp = Math.min(FLY_SPEED * speedBoost(), (d - FOLLOW_DEADZONE) * FOLLOW_GAIN);

    const wall = wallAhead(Math.sign(dx));

    const gap = dir > 0 ? r.x0 - (c.x + copterHX) : (c.x - copterHX) - r.x1;

function stepCopter(dt) {

    if (G.L.hunger && isFood(c.landed.stop) && G.food < 1) {   // landed at food: the pilot munches the meter full

function cruiseHeight(x0, x1, minY) {

  const cy = cruiseHeight(c.x, tx, s.y);

}

}
function nearestFood() {

}

    if (waitingAt(here).some((p) => p.seats <= G.seats - seatsUsed())) return;
    if (G.L.hunger && isFood(here) && G.food < 0.95) return;
  }
  let target = -1;
  if (G.L.hunger && G.food < 0.35) target = nearestFood();
  else if (c.riders.length) target = c.riders.map((p) => p.to).sort((a, b) => Math.abs(G.stops[a].x - c.x) - Math.abs(G.stops[b].x - c.x))[0];

const camTarget = new THREE.Vector3();

function layout() {
  const w = innerWidth, h = innerHeight;

  renderer.setSize(w, h, false);

  $('pads').hidden = !(G.phase === 'play' && ctlMode === 'pads');
  if (!G.L) return;
  const L = G.L, top = TOP_BAR, bottom = ctlMode === 'pads' && G.phase === 'play' ? PAD_BAR : 8;
  const Ww = L.w + 1.2, Hw = L.h + 1.6;                  // valley plus a strip of the ground's cut edge (y -1.4 .. h + 0.2)
  const tanH = Math.tan(THREE.MathUtils.degToRad(CAM_FOV / 2));
  const usable = (h - top - bottom) / h;
  let d = Math.min(Math.max(Hw / (2 * tanH * usable), Ww / (2 * tanH * camera.aspect)) * 1.02, h / MIN_UNIT_PX / (2 * tanH));
  if (Ww > MAX_VIEW_W) d = Math.min(d, MAX_VIEW_W / (2 * tanH * camera.aspect));
  const vh = 2 * d * tanH, vw = vh * camera.aspect, uh = vh * usable;

  cam.xr = vw >= Ww ? [L.w / 2, L.w / 2] : [vw / 2 - 0.6, L.w + 0.6 - vw / 2];
  cam.yr = uh >= Hw ? [-1.4 + uh / 2, -1.4 + uh / 2] : [-1.4 + uh / 2, L.h + 0.2 - uh / 2];   // spare height goes to the sky, not the dirt
  cam.uh = uh; cam.yTop = Math.max(cam.yr[1], L.h + SKY_EXTRA + 0.6 - uh / 2);   // up to here when the copter climbs into the extra sky
  if (!cam.ready) { cam.ready = true; updateCamera(0, true); } else updateCamera(0);
  sun.position.set(L.w / 2 + TOD.sunPos[0], TOD.sunPos[1], TOD.sunPos[2]); sun.target.position.set(L.w / 2, 0, 0);
  if (scene.fog) { scene.fog.near = d + 18; scene.fog.far = d + 140; }
  const sc = sun.shadow.camera, half = Math.max(L.w, L.h) * 0.75;

function updateCamera(dt, snap) {

}

/* ======== haptics (as math5/haptics.js) ======== */
// Android: navigator.vibrate. iPhone/iPad (Safari, iOS 18+): clicking a hidden native switch gives a system tap, but
// only reliably right after a touch. Elsewhere it quietly does nothing. The 📳 button on the map turns it off.
const Haptics = (() => {
  const PATTERNS = { tap: [10], land: [25], ok: [20, 50, 20], bad: [70], bump: [60, 40, 60], splash: [40, 30, 40], ring: [15, 30, 15], hungry: [30, 60, 30], win: [50, 70, 50, 70, 180] };
  const touch = navigator.maxTouchPoints > 0, canVibrate = touch && typeof navigator.vibrate === 'function';
  const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const useSwitch = !canVibrate && isIOS;
  let on = store.get('vibrate', true);
  const iosTap = () => {
    try {
      const label = document.createElement('label'), input = document.createElement('input');
      label.setAttribute('aria-hidden', 'true'); label.style.display = 'none';
      input.type = 'checkbox'; input.setAttribute('switch', ''); label.appendChild(input);
      document.head.appendChild(label); label.click(); document.head.removeChild(label);
    } catch (e) { /* no haptics */ }
  };
  return {
    supported: canVibrate || useSwitch,
    isOn: () => on,
    setOn(v) { on = !!v; store.set('vibrate', on); if (!on && canVibrate) try { navigator.vibrate(0); } catch (e) { /* ignore */ } },
    buzz(name) {
      const p = PATTERNS[name];
      if (!on || !p || IS_TEST) return;
      if (canVibrate) { try { navigator.vibrate(p); } catch (e) { /* ignore */ } }
      else if (useSwitch) { const taps = Math.min(4, Math.ceil(p.length / 2)); iosTap(); for (let i = 1; i < taps; i++) setTimeout(iosTap, i * 110); }
    },
  };
})();

/* ======== drawing the state ======== */
function syncCopter(dt) {
  const c = G.copter, v = c.vis;
  if (Math.abs(c.vx) > TURN_SPEED) c.face = Math.sign(c.vx);
  // it really turns round (through facing us), a quick smooth swing with a little settle at the end
  const yawTarget = c.face > 0 ? 0 : -Math.PI;
  c.yawV += ((yawTarget - c.yaw) * TURN_SPRING - c.yawV * TURN_DAMP) * dt; c.yaw += c.yawV * dt;
  v.turn.rotation.y = c.yaw;
  const hover = c.landed ? 0 : Math.sin(G.t * 3.1) * 0.05;
  v.group.position.set(c.x, c.y + hover, 0);
  const fwd = c.vx * c.face;                                       // speed in the direction it points
  c.pitch = approach(c.pitch, clamp(-fwd * TILT_PER_SPEED, -TILT_MAX, TILT_MAX * 0.7), dt * 1.5);
  v.tilt.rotation.z = c.pitch;                                     // nose down when flying forward
  v.tilt.rotation.x = clamp(-c.yawV * BANK_PER_TURN, -BANK_MAX, BANK_MAX);   // and it banks into the turn
  v.pilot.group.rotation.y = -c.yaw;                               // the pilot keeps facing us
  const rate = c.landed ? (c.pedal > 0.05 ? 6 : 0) : (8 + c.pedal * 16) * speedBoost();
  c.rotorRate = approach(c.rotorRate, rate, dt * 12);
  c.rotor += c.rotorRate * dt; v.rotor.rotation.y = c.rotor; v.tailRotor.rotation.z = c.rotor * 2.2;
  const stroke = Math.floor(c.crank / Math.PI);
  c.crank += (c.landed ? 0 : 3 + c.pedal * 9) * dt; v.crank.rotation.z = -c.crank;
  if (Math.floor(c.crank / Math.PI) !== stroke && c.pedal > 0.45 && G.phase === 'play') sfx('creak');   // wooden creak each pedal stroke
  v.pilot.legs[0].position.y = 0.32 + Math.sin(c.crank) * 0.05; v.pilot.legs[1].position.y = 0.32 - Math.sin(c.crank) * 0.05;
  for (const f of v.flameAnims) f(G.t);
  v.light.intensity = TOD.lamp * (0.9 + Math.sin(G.t * 19) * 0.1);
  v.pilot.body.position.y = c.landed ? 0 : Math.abs(Math.sin(c.crank)) * 0.03;
  c.dizzy = Math.max(0, c.dizzy - dt);
  const hungry = G.L.hunger && G.food <= 0;
  v.pilot.face.material = c.dizzy > 0 ? faceMats.dizzy : faceMats[hungry ? 2 : 0];
  c.eating = Math.max(0, c.eating - dt);
  v.pilot.arms[0].rotation.z = c.eating > 0 ? -2.3 + Math.sin(G.t * 14) * 0.25 : -0.25;
  v.thought.visible = !!(G.L.hunger && G.food < FOOD_LOW && c.eating <= 0);   // (three.js shows anything not exactly false)
  v.thought.scale.setScalar(0.7 + Math.sin(G.t * 5) * 0.06);
  if (G.L.hunger) { $('food').classList.toggle('low', G.food < FOOD_LOW); $('food').style.setProperty('--f', G.food.toFixed(3)); }
  const used = seatsUsed();
  v.lamps.forEach((l, k) => { const on = k < used; const flash = G.fullT > 3 && Math.sin(G.t * 20) > 0; l.material = on && !flash ? v.lampOn : v.lampOff; });
  if (whirr && AC) {
    const flying = !c.landed || c.rotorRate > 1;
    whirr.o.frequency.setTargetAtTime(30 + c.rotorRate * 3.2, AC.currentTime, 0.05);
    const level = flying && G.phase === 'play' ? 0.03 + c.pedal * 0.05 : 0;
    whirr.gn.gain.setTargetAtTime(level, AC.currentTime, 0.08);
    whirr.depth.gain.setTargetAtTime(level * 0.55, AC.currentTime, 0.08);
    whirr.lfo.frequency.setTargetAtTime(Math.max(1, c.rotorRate * 4 / (Math.PI * 2)), AC.currentTime, 0.1);
    whirr.f.frequency.setTargetAtTime(300 + c.pedal * 260, AC.currentTime, 0.1);
  }
}
function syncPeople() {
  for (const p of G.people) {
    const f = p.fig, g = f.group;
    const jump = p.state === 'cheer' ? Math.abs(Math.sin(p.timer * 9)) * 0.45 : p.jump > 0 ? Math.sin(p.jump / 0.35 * Math.PI) * 0.25 : 0;
    if (p.state === 'ride') {
      g.position.set(p.seats > 1 ? (seatX(p.seat) + seatX(p.seat + 1)) / 2 : seatX(p.seat), 0.42 + jump, 0); g.scale.setScalar(0.9 * p.size);
      g.rotation.y = -G.copter.yaw;   // riders face us whichever way the copter points
    } else {
      const bob = p.walking ? Math.abs(Math.sin(p.walk * 10)) * (p.state === 'leave' ? 0.1 : 0.06) : 0;
      g.position.set(p.x, p.y + bob + jump, p.z); g.scale.setScalar(Math.max(0.001, p.scale * p.size)); g.rotation.y = 0;
      f.body.scale.x = p.face < 0 ? -1 : 1;
    }
    const stride = p.walking ? Math.sin(p.walk * 10) * 0.07 : 0;
    f.legs[0].position.y = 0.32 + Math.max(0, stride); f.legs[1].position.y = 0.32 + Math.max(0, -stride);
    const armUp = p.state === 'cheer' ? 2.6 : (p.state === 'wait' && !p.walking && p.stage === 0 && Math.sin(G.t * 2 + p.id) > 0.6) ? 2.4 : 0;
    f.arms[0].rotation.z = -0.25 - armUp; f.arms[1].rotation.z = 0.25 + (p.state === 'cheer' ? 2.6 : 0);
    f.face.material = faceMats[p.state === 'cheer' || p.state === 'home' ? 0 : p.stage];
    const showBubble = p.state === 'wait' || p.state === 'board' || p.state === 'ride';
    f.bubble.visible = showBubble;
    if (showBubble) {
      const map = badgeTex(G.stops[p.to], p.stage);
      if (f.bubble.material.map !== map) { f.bubble.material.map = map; f.bubble.material.needsUpdate = true; }
      const ride = p.state === 'ride', s = clamp(BUBBLE_PX / cam.pxu, 0.9, 2.2) * (ride ? 0.85 : 1);
      const gs = ride ? 0.9 * p.size : p.size;           // bubbles keep their size on screen whoever carries them
      f.bubble.scale.set(s / gs, s / gs, 1);
      f.bubble.position.set(0, 1.5 + (s / 2 + (ride ? (p.seat % 2) * s * 0.8 : 0)) / gs, 0);
    }
  }
}
function syncWorld(dt) {
  for (const f of world.userData.anims) f(G.t, dt);
}

/* ======== main loop & boot ======== */
function step(dt) {
  G.t += dt;
  if (G.phase === 'play') {
    if (Q.has('demo')) stepBot(dt);
    stepCopter(dt);
    stepHazards(dt);
    stepPowerups(dt);
    stepRush(dt);
    stepAmbience(dt);
    G.nextArrival -= dt;
    if (G.nextArrival <= 0 && G.winT < 0) {
      if (G.people.length < MAX_PEOPLE) spawnPerson();
      G.nextArrival = G.L.every * (1 + (rng() * 2 - 1) * ARRIVE_JITTER);
    }
    stepPeople(dt);
    if (G.winT >= 0) { G.winT -= dt; if (G.winT < 0) showWin(); }
  }
  stepFx(dt);
}
let last = performance.now(), acc = 0;
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  acc += real * (Q.has('fast') ? FAST_MULT : 1);
  let n = 0;
  while (acc >= FIXED_DT && n++ < 40) { step(FIXED_DT); acc -= FIXED_DT; }
  if (G.copter) { updateCamera(real); syncCopter(real); syncPeople(); syncWorld(real); syncHazards(); syncPowerups(real); updateEdges(); }
  updateHint();
  if (++shadowN >= SHADOW_EVERY) { shadowN = 0; renderer.shadowMap.needsUpdate = true; }
  adaptDpr(real * 1000);
  renderer.render(scene, camera);
}
function loop(now) { frame(now); requestAnimationFrame(loop); }

setMuted(muted);
if (NO_AUDIO) $('muteBtn').textContent = '🔇';
if (Q.has('level')) play(+Q.get('level') - 1);
else { startLevel(Math.min(unlockedCount(), LEVELS.length) - 1); showMap(); }
if (Q.has('tick')) setInterval(() => frame(performance.now()), 16);
else requestAnimationFrame(loop);
</script>
<script>
// Offline support: sw.js caches this page. Once the page has loaded, send it every file the page used (fonts,
// three.js) so those work offline too. Fails quietly where unsupported, e.g. on file://.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
  // When sw.js says a newer version of this page has just been downloaded, reload once to show it: straight away if
  // nobody has tapped or pressed a key yet, otherwise when the page comes back after 5+ minutes away, so a game in
  // progress is never lost. A timestamp in sessionStorage stops a second reload within 30 s.
  let started = false, newer = false, hiddenAt = 0;
  addEventListener('pointerdown', () => { started = true; }, true);
  addEventListener('keydown', () => { started = true; }, true);
  const reload = () => {
    const key = 'tbx-sw-reload:' + location.pathname;
    try { if (Date.now() - (+sessionStorage.getItem(key) || 0) < 30000) return; sessionStorage.setItem(key, Date.now()); } catch { return; }
    location.reload();
  };
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.updated) { newer = true; if (!started) reload(); } });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (newer && hiddenAt && Date.now() - hiddenAt >= 5 * 60 * 1000) reload();
  });
}
</script>
